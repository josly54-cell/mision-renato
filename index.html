<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Misión Renato PRO</title>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#ffe6f0,#fff);
  overflow:hidden;
}

/* fondo corazones */
.heart{
  position:absolute;
  color:#ff4d88;
  animation:float 6s linear infinite;
  font-size:20px;
}

@keyframes float{
  0%{transform:translateY(100vh); opacity:0;}
  50%{opacity:1;}
  100%{transform:translateY(-10vh); opacity:0;}
}

.container{
  position:relative;
  max-width:650px;
  margin:60px auto;
  background:white;
  padding:30px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.15);
  text-align:center;
  z-index:2;
}

h1{
  color:#ff4d88;
}

/* personaje */
#personaje{
  width:120px;
  border-radius:50%;
  margin-bottom:15px;
  box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

/* botones */
button{
  margin:8px;
  padding:10px 18px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  background:#ff4d88;
  color:white;
  transition:0.3s;
}

button:hover{
  background:#e6005c;
}

/* texto */
#texto{
  font-size:16px;
  color:#444;
  min-height:80px;
}

/* final */
#final{
  display:none;
}

</style>
</head>

<body>

<div class="container">

<h1>💌 Misión Renato PRO</h1>

<img id="personaje" src="https://i.imgur.com/8Km9tLL.png">

<p id="texto">
Hace más de un año lo conociste en el trabajo… y desde el primer momento te cayó bien y te pareció muy lindo.
</p>

<div id="opciones">
<button onclick="nivel1()">Continuar</button>
</div>

<div id="final">

<h2>💛 MISIÓN COMPLETADA</h2>

<p id="mensajeFinal"></p>

<button onclick="reiniciar()">Repetir misión</button>

</div>

</div>

<script>

let energia = 0; // contador de decisiones emocionales

function nivel1(){
  document.getElementById("texto").innerText =
  "En el trabajo empezaron a hablar más… risas, bromas y miradas que duraban un poco más de lo normal.";

  document.getElementById("opciones").innerHTML =
  `<button onclick="nivel2(1)">Seguir la broma</button>
   <button onclick="nivel2(0)">Sonreír tímidamente</button>`;
}

function nivel2(valor){
  energia += valor;

  document.getElementById("texto").innerText =
  "Después del trabajo empezaron a ir al parque… y esas conversaciones se volvieron tu momento favorito del día.";

  document.getElementById("opciones").innerHTML =
  `<button onclick="nivel3(1)">Dejar fluir</button>
   <button onclick="nivel3(0)">Controlarte un poco</button>`;
}

function nivel3(valor){
  energia += valor;

  document.getElementById("texto").innerText =
  "Había algo entre ustedes que no necesitaba decirse… pero tampoco se ignoraba.";

  document.getElementById("opciones").innerHTML =
  `<button onclick="finalJuego(1)">Arriesgarte</button>
   <button onclick="finalJuego(0)">Esperar más</button>`;
}

function finalJuego(valor){
  energia += valor;

  document.querySelector("h1").style.display = "none";
  document.getElementById("texto").style.display = "none";
  document.getElementById("opciones").style.display = "none";
  document.getElementById("final").style.display = "block";

  let mensaje = "";

  if(energia >= 3){
    mensaje = `
💖 FINAL ROMÁNTICO<br><br>
Desde el primer momento hubo algo especial… y sin forzarlo, todo fue creciendo con el tiempo.<br><br>
No fue perfecto, pero fue real.<br><br>
✨ Felices 11 meses ✨<br>
Gracias por esta historia bonita que empezó sin planearse… pero se quedó.
`;
  }
  else if(energia == 2){
    mensaje = `
🌿 FINAL TRANQUILO<br><br>
Lo que vivieron fue bonito, ligero y sincero.<br><br>
A veces las mejores historias no necesitan definirse para ser importantes.<br><br>
✨ Felices 11 meses ✨
`;
  }
  else{
    mensaje = `
💭 FINAL SUAVE<br><br>
Tal vez no se dijo todo… pero se sintió bastante.<br><br>
Y eso también cuenta como una historia bonita.<br><br>
✨ Felices 11 meses ✨
`;
  }

  document.getElementById("mensajeFinal").innerHTML = mensaje;
}

function reiniciar(){
  location.reload();
}

/* corazones animados */
function crearCorazon(){
  const heart = document.createElement("div");
  heart.classList.add("heart");
  heart.innerHTML = "💗";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (10 + Math.random() * 20) + "px";
  document.body.appendChild(heart);

  setTimeout(()=>{ heart.remove(); },6000);
}

setInterval(crearCorazon,300);

</script>

</body>
</html>
