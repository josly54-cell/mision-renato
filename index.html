<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Misión Renato PRO</title>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#ffe6f0,#fff);
  overflow:hidden;
}

/* fondo corazones */
.heart{
  position:absolute;
  color:#ff4d88;
  animation:float 6s linear infinite;
  font-size:20px;
}

@keyframes float{
  0%{transform:translateY(100vh); opacity:0;}
  50%{opacity:1;}
  100%{transform:translateY(-10vh); opacity:0;}
}

.container{
  position:relative;
  max-width:650px;
  margin:60px auto;
  background:white;
  padding:30px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.15);
  text-align:center;
  z-index:2;
}

h1{
  color:#ff4d88;
}

/* 👤 PERSONAJE MÁS GRANDE */
#personaje{
  width:180px;
  border-radius:50%;
  margin-bottom:15px;
  box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

/* botones */
button{
  margin:8px;
  padding:10px 18px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  background:#ff4d88;
  color:white;
  transition:0.3s;
}

button:hover{
  background:#e6005c;
}

/* texto */
#texto{
  font-size:16px;
  color:#444;
  min-height:80px;
}

/* final */
#final{
  display:none;
}

</style>
</head>

<body>

<div class="container">

<h1>💌 Misión Renato PRO</h1>

<img id="personaje" src="personajes.png">

<p id="texto">
Hace más de un año lo conociste en el trabajo… y desde el primer momento te cayó bien y te pareció muy lindo.
</p>

<div id="opciones">
<button onclick="nivel1()">Continuar</button>
</div>

<div id="final">

<h2>💛 MISIÓN COMPLETADA</h2>

<p id="mensajeFinal"></p>

<button onclick="reiniciar()">Repetir misión</button>

</div>

</div>

<script>

let energia = 0;

function nivel1(){
  document.getElementById("texto").innerText =
  "En el trabajo empezaron a hablar más… risas, bromas y miradas que duraban un poco más de lo normal.";

  document.getElementById("opciones").innerHTML =
  `<button onclick="nivel2(1)">Seguir la broma</button>
   <button onclick="nivel2(0)">Sonreír tímidamente</button>`;
}

function nivel2(valor){
  energia += valor;

  document.getElementById("texto").innerText =
  "Después del trabajo empezaron a ir al parque… y esas conversaciones se volvieron tu momento favorito del día.";

  document.getElementById("opciones").innerHTML =
  `<button onclick="nivel3(1)">Dejar fluir</button>
   <button onclick="nivel3(0)">Controlarte un poco</button>`;
}

function nivel3(valor){
  energia += valor;

  document.getElementById("texto").innerText =
  "Había algo entre ustedes que no necesitaba decirse… pero tampoco se ignoraba.";

  document.getElementById("opciones").innerHTML =
  `<button onclick="finalJuego(1)">Arriesgarte</button>
   <button onclick="finalJuego(0)">Esperar más</button>`;
}

function finalJuego(valor){
  energia += valor;

  document.querySelector("h1").style.display = "none";
  document.getElementById("texto").style.display = "none";
  document.getElementById("opciones").style.display = "none";
  document.getElementById("final").style.display = "block";

  let mensaje = "";

  if(energia >= 3){
    mensaje = `
💖 FINAL ROMÁNTICO<br><br>
<img src="final romantico.png" width="220"><br><br>

A veces la vida no avisa cuando algo importante empieza… simplemente pasa.<br><br>

Y contigo, todo empezó así: entre risas en el trabajo, miradas que duraban un poquito más de lo normal y conversaciones que se volvían el mejor momento del día.<br><br>

Sin planearlo, sin darse cuenta, algo bonito fue creciendo… algo que se sentía natural, cómodo y especial al mismo tiempo.<br><br>

No fue perfecto, pero fue real. Y eso es lo que lo hace único.<br><br>

✨ Gracias por estos 11 meses de historia bonita mi baby✨<br>
Y por todos los momentos que hicieron que esto valga la pena recordar.
`;
  }
  else if(energia == 2){
    mensaje = `
🌿 FINAL TRANQUILO<br><br>
<img src="final tranquilo.png" width="220"><br><br>

No todo tiene que ser intenso para ser importante.<br><br>

Entre risas en el trabajo, bromas que nadie más entendía y conversaciones en el parque después del día, se fue creando algo bonito sin planearlo demasiado.<br><br>

No fue una película dramática ni un cuento perfecto… pero sí una historia con momentos que te sacan una sonrisa cuando los recuerdas.<br><br>

Y al final, eso también cuenta ✨<br><br>

✨ Felices 11 meses ✨
`;
  }
  else{
    mensaje = `
💭 FINAL DULCE<br><br>
<img src="final dulce.png" width="220"><br><br>

No todo fue perfecto, pero sí especial a su manera.<br><br>

Entre días normales, conversaciones simples y momentos después del trabajo, se fue creando una conexión que sin hacer mucho ruido, se sentía bonita.<br><br>

Tal vez no hubo grandes declaraciones ni escenas de película… pero sí detalles pequeños que se quedan en la memoria.<br><br>

Y a veces, lo más bonito no es lo intenso, sino lo simple que te hace bien ✨<br><br>

✨ Felices 11 meses ✨
`;
  }

  document.getElementById("mensajeFinal").innerHTML = mensaje;
}

function reiniciar(){
  location.reload();
}

/* corazones animados */
function crearCorazon(){
  const heart = document.createElement("div");
  heart.classList.add("heart");
  heart.innerHTML = "💗";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (10 + Math.random() * 20) + "px";
  document.body.appendChild(heart);

  setTimeout(()=>{ heart.remove(); },6000);
}

setInterval(crearCorazon,300);

</script>

</body>
</html>
